<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title description">
  <title id="title">Task states and transitions</title>
  <desc id="description">A task starts in draft and enters running when admitted. Running can wait for approval, capacity or a dependency, hand off when a reserve is reached or a route is lost, or become interrupted after a controller restart. Waiting can return to running. A handoff returns to running when a successor is admitted; interruption returns after reconciliation and resume. A stop request enters stopping, followed by stopped when quiescence is proven or unknown when ownership is unproven. Running can fail or seal work as a candidate for checking. Recorded evidence advances checking to ready. Creating a new local branch advances ready to accepted.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; font-size: 17px; }
    .node { fill: #fff; stroke: #64748b; stroke-width: 1.5; }
    .edge { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
    .label { font-size: 15px; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <rect width="960" height="960" rx="12" fill="#f8fafc"/>
  <circle cx="450" cy="25" r="6" fill="#172033"/>
  <path class="edge" d="M450 31 V50"/>
  <path class="edge" d="M450 110 V180"/>
  <path class="edge" d="M365 210 H295 V280 H175 V240"/>
  <path class="edge" d="M175 180 V135 H395 V180"/>
  <path class="edge" d="M535 210 H600 V280 H725 V240"/>
  <path class="edge" d="M725 180 V135 H505 V180"/>
  <path class="edge" d="M365 220 H310 V420 H265"/>
  <path class="edge" d="M175 450 V500 H340 V260 H390 V240"/>
  <path class="edge" d="M535 220 H590 V420 H635"/>
  <path class="edge" d="M705 450 V535 H650 V590"/>
  <path class="edge" d="M745 450 V535 H855 V590"/>
  <path class="edge" d="M450 240 V590"/>
  <path class="edge" d="M450 650 V730"/>
  <path class="edge" d="M450 790 V870"/>
  <path class="edge" d="M410 240 V560 H75 V620 H90"/>
  <text x="465" y="125" text-anchor="start" class="label"><tspan x="465" dy="0">start (admitted)</tspan></text>
  <text x="182" y="306" text-anchor="middle" class="label"><tspan x="182" dy="0">approval, capacity</tspan><tspan x="182" dy="20">or dependency</tspan></text>
  <text x="760" y="306" text-anchor="middle" class="label"><tspan x="760" dy="0">reserve reached</tspan><tspan x="760" dy="20">or route lost</tspan></text>
  <text x="680" y="120" text-anchor="middle" class="label"><tspan x="680" dy="0">successor admitted</tspan></text>
  <text x="182" y="350" text-anchor="middle" class="label"><tspan x="182" dy="0">controller restart</tspan></text>
  <text x="172" y="528" text-anchor="middle" class="label"><tspan x="172" dy="0">reconciled and resumed</tspan></text>
  <text x="690" y="350" text-anchor="middle" class="label"><tspan x="690" dy="0">stop requested</tspan></text>
  <text x="650" y="570" text-anchor="middle" class="label"><tspan x="650" dy="0">quiescence proven</tspan></text>
  <text x="855" y="570" text-anchor="middle" class="label"><tspan x="855" dy="0">ownership unproven</tspan></text>
  <text x="466" y="490" text-anchor="start" class="label"><tspan x="466" dy="0">work sealed</tspan><tspan x="466" dy="20">as candidate</tspan></text>
  <text x="466" y="697" text-anchor="start" class="label"><tspan x="466" dy="0">evidence recorded</tspan></text>
  <text x="466" y="837" text-anchor="start" class="label"><tspan x="466" dy="0">new local branch created</tspan></text>
  <rect class="node" x="365" y="50" width="170" height="60" rx="8"/>
  <text x="450.0" y="86.0" text-anchor="middle"><tspan x="450.0" dy="0">draft</tspan></text>
  <rect class="node" x="365" y="180" width="170" height="60" rx="8"/>
  <text x="450.0" y="216.0" text-anchor="middle"><tspan x="450.0" dy="0">running</tspan></text>
  <rect class="node" x="90" y="180" width="175" height="60" rx="8"/>
  <text x="177.5" y="216.0" text-anchor="middle"><tspan x="177.5" dy="0">waiting</tspan></text>
  <rect class="node" x="635" y="180" width="180" height="60" rx="8"/>
  <text x="725.0" y="216.0" text-anchor="middle"><tspan x="725.0" dy="0">handing_off</tspan></text>
  <rect class="node" x="90" y="390" width="175" height="60" rx="8"/>
  <text x="177.5" y="426.0" text-anchor="middle"><tspan x="177.5" dy="0">interrupted</tspan></text>
  <rect class="node" x="635" y="390" width="180" height="60" rx="8"/>
  <text x="725.0" y="426.0" text-anchor="middle"><tspan x="725.0" dy="0">stopping</tspan></text>
  <rect class="node" x="90" y="590" width="175" height="60" rx="8"/>
  <text x="177.5" y="626.0" text-anchor="middle"><tspan x="177.5" dy="0">failed</tspan></text>
  <rect class="node" x="365" y="590" width="170" height="60" rx="8"/>
  <text x="450.0" y="626.0" text-anchor="middle"><tspan x="450.0" dy="0">checking</tspan></text>
  <rect class="node" x="575" y="590" width="150" height="60" rx="8"/>
  <text x="650.0" y="626.0" text-anchor="middle"><tspan x="650.0" dy="0">stopped</tspan></text>
  <rect class="node" x="780" y="590" width="150" height="60" rx="8"/>
  <text x="855.0" y="626.0" text-anchor="middle"><tspan x="855.0" dy="0">unknown</tspan></text>
  <rect class="node" x="365" y="730" width="170" height="60" rx="8"/>
  <text x="450.0" y="766.0" text-anchor="middle"><tspan x="450.0" dy="0">ready</tspan></text>
  <rect class="node" x="365" y="870" width="170" height="60" rx="8"/>
  <text x="450.0" y="906.0" text-anchor="middle"><tspan x="450.0" dy="0">accepted</tspan></text>
</svg>
