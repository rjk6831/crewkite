<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="790" viewBox="0 0 1140 790" role="img" aria-labelledby="title description">
  <title id="title">Task decisions and ownership boundaries</title>
  <desc id="description">A project goal with selected context enters counted planning. Explicit plan adoption leads to separate execution preparation and Start. Owned work retains a candidate. Supported profiles require full checks, separate review and destination permission before a new branch is accepted. Stop requests enter stopping and settle as stopped only with the required proof; missing ownership remains unknown. The diagram summarizes decision boundaries, not every task state or provider capability.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs>
  <style>text { font-family: Arial, Helvetica, sans-serif; fill: #172033; font-size: 20px; } .node { fill: #fff; stroke: #64748b; stroke-width: 1.5; } .edge { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); } .detail { font-size: 18px; fill: #334155; }</style>
  <rect width="1140" height="790" rx="12" fill="#f8fafc"/>
  <rect class="node" x="30" y="40" width="300" height="75" rx="8"/>
  <text x="180.0" y="69" text-anchor="middle">Project goal</text>
  <text x="180.0" y="93" text-anchor="middle" class="detail">Selected immutable context</text>
  <rect class="node" x="420" y="40" width="300" height="75" rx="8"/>
  <text x="570.0" y="69" text-anchor="middle">Counted planning</text>
  <text x="570.0" y="93" text-anchor="middle" class="detail">Questions and proposed plan</text>
  <rect class="node" x="810" y="40" width="300" height="75" rx="8"/>
  <text x="960.0" y="69" text-anchor="middle">Explicit adoption</text>
  <text x="960.0" y="93" text-anchor="middle" class="detail">Save the task contract</text>
  <path class="edge" d="M330 78 H420"/>
  <path class="edge" d="M720 78 H810"/>
  <path class="edge" d="M960 115 V220"/>
  <rect class="node" x="810" y="220" width="300" height="75" rx="8"/>
  <text x="960.0" y="249" text-anchor="middle">Prepare execution</text>
  <text x="960.0" y="273" text-anchor="middle" class="detail">Source, permissions and limits</text>
  <rect class="node" x="420" y="220" width="300" height="75" rx="8"/>
  <text x="570.0" y="249" text-anchor="middle">Start owned work</text>
  <text x="570.0" y="273" text-anchor="middle" class="detail">Intent before provider input</text>
  <rect class="node" x="30" y="220" width="300" height="75" rx="8"/>
  <text x="180.0" y="249" text-anchor="middle">Retained candidate</text>
  <text x="180.0" y="273" text-anchor="middle" class="detail">Exact bytes after cleanup</text>
  <path class="edge" d="M810 258 H720"/>
  <path class="edge" d="M420 258 H330"/>
  <path class="edge" d="M180 295 V390"/>
  <rect class="node" x="30" y="390" width="230" height="75" rx="8"/>
  <text x="145.0" y="419" text-anchor="middle">Full checks</text>
  <text x="145.0" y="443" text-anchor="middle" class="detail">Exact candidate tests</text>
  <rect class="node" x="320" y="390" width="230" height="75" rx="8"/>
  <text x="435.0" y="419" text-anchor="middle">Separate review</text>
  <text x="435.0" y="443" text-anchor="middle" class="detail">Bound contributor origin</text>
  <rect class="node" x="610" y="390" width="230" height="75" rx="8"/>
  <text x="725.0" y="419" text-anchor="middle">Destination permission</text>
  <text x="725.0" y="443" text-anchor="middle" class="detail">Exact destination grant</text>
  <rect class="node" x="900" y="390" width="210" height="75" rx="8"/>
  <text x="1005.0" y="419" text-anchor="middle">Accepted branch</text>
  <text x="1005.0" y="443" text-anchor="middle" class="detail">New local ref only</text>
  <path class="edge" d="M260 428 H320"/>
  <path class="edge" d="M550 428 H610"/>
  <path class="edge" d="M840 428 H900"/>
  <text x="570" y="515" text-anchor="middle" class="detail">Checks, review and acceptance depend on profile support and separate authority.</text>
  <text x="570" y="565" text-anchor="middle">Stop path from owned work</text>
  <rect class="node" x="30" y="600" width="250" height="75" rx="8"/>
  <text x="155.0" y="629" text-anchor="middle">Stopping</text>
  <text x="155.0" y="653" text-anchor="middle" class="detail">Cancellation requested</text>
  <rect class="node" x="420" y="600" width="300" height="75" rx="8"/>
  <text x="570.0" y="629" text-anchor="middle">Stopped</text>
  <text x="570.0" y="653" text-anchor="middle" class="detail">Required closure proof retained</text>
  <rect class="node" x="810" y="600" width="300" height="75" rx="8"/>
  <text x="960.0" y="629" text-anchor="middle">Unknown</text>
  <text x="960.0" y="653" text-anchor="middle" class="detail">Ownership proof missing</text>
  <path class="edge" d="M280 638 H420"/>
  <path class="edge" d="M155 675 V715 H960 V675"/>
  <text x="570" y="755" text-anchor="middle" class="detail">Unknown ownership blocks successors and acceptance. Reopening does not restart inference.</text>
</svg>
