<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title description">
  <title id="title">Desktop and CLI share one controller</title>
  <desc id="description">The desktop app and CLI connect through a shared client over a private socket to one controller. The controller contains SQLite state, immutable artifacts, a usage-aware router and an execution host. The execution host connects to scripted fake routes.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; font-size: 17px; }
    .node { fill: #fff; stroke: #64748b; stroke-width: 1.5; }
    .edge { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
    .label { font-size: 15px; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="400" rx="12" fill="#f8fafc"/>
  <rect x="460" y="30" width="290" height="340" rx="12" fill="#e8eef5" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="605" y="63" text-anchor="middle"><tspan x="605" dy="0">Controller</tspan></text>
  <path class="edge" d="M175 110 H215 V190 H235"/>
  <path class="edge" d="M175 270 H215 V190 H235"/>
  <path class="edge" d="M385 190 H460"/>
  <path class="edge" d="M720 307 H790"/>
  <text x="422" y="155" text-anchor="middle" class="label"><tspan x="422" dy="0">private</tspan><tspan x="422" dy="20">socket</tspan></text>
  <rect class="node" x="25" y="80" width="150" height="60" rx="8"/>
  <text x="100.0" y="116.0" text-anchor="middle"><tspan x="100.0" dy="0">Desktop app</tspan></text>
  <rect class="node" x="25" y="240" width="150" height="60" rx="8"/>
  <text x="100.0" y="276.0" text-anchor="middle"><tspan x="100.0" dy="0">CLI</tspan></text>
  <rect class="node" x="235" y="160" width="150" height="60" rx="8"/>
  <text x="310.0" y="196.0" text-anchor="middle"><tspan x="310.0" dy="0">Shared client</tspan></text>
  <rect class="node" x="490" y="85" width="230" height="50" rx="8"/>
  <text x="605.0" y="116.0" text-anchor="middle"><tspan x="605.0" dy="0">SQLite state</tspan></text>
  <rect class="node" x="490" y="150" width="230" height="50" rx="8"/>
  <text x="605.0" y="181.0" text-anchor="middle"><tspan x="605.0" dy="0">Immutable artifacts</tspan></text>
  <rect class="node" x="490" y="215" width="230" height="50" rx="8"/>
  <text x="605.0" y="246.0" text-anchor="middle"><tspan x="605.0" dy="0">Usage-aware router</tspan></text>
  <rect class="node" x="490" y="280" width="230" height="55" rx="8"/>
  <text x="605.0" y="313.5" text-anchor="middle"><tspan x="605.0" dy="0">Execution host</tspan></text>
  <rect class="node" x="790" y="277" width="180" height="60" rx="8"/>
  <text x="880.0" y="313.0" text-anchor="middle"><tspan x="880.0" dy="0">Scripted fake routes</tspan></text>
</svg>
