<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">One controller owns the workspace</title>
  <desc id="description">Desktop conversation and CLI connect through a shared client to one controller. SQLite facts, immutable artifacts, authority gates and execution ownership remain in that controller. It connects to installed OpenAI and Anthropic clients and an explicitly configured Local runtime. Google setup and quota have separate owned operations; its ACP writer remains unavailable pending evidence. This is an architecture diagram, not route qualification evidence.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs>
  <style>text { font-family: Arial, Helvetica, sans-serif; fill: #172033; font-size: 20px; } .node { fill: #fff; stroke: #64748b; stroke-width: 1.5; } .edge { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); } .detail { font-size: 18px; fill: #334155; }</style>
  <rect width="1200" height="620" rx="12" fill="#f8fafc"/>
  <rect x="470" y="40" width="330" height="500" rx="12" fill="#e8eef5" stroke="#94a3b8"/>
  <text x="635" y="75" text-anchor="middle">Controller</text>
  <rect class="node" x="20" y="150" width="190" height="75" rx="8"/>
  <text x="115.0" y="179" text-anchor="middle">Desktop</text>
  <text x="115.0" y="203" text-anchor="middle" class="detail">Primary conversation</text>
  <rect class="node" x="20" y="330" width="190" height="75" rx="8"/>
  <text x="115.0" y="359" text-anchor="middle">CLI</text>
  <text x="115.0" y="383" text-anchor="middle" class="detail">Tasks and receipts</text>
  <rect class="node" x="255" y="240" width="170" height="75" rx="8"/>
  <text x="340.0" y="269" text-anchor="middle">Shared client</text>
  <text x="340.0" y="293" text-anchor="middle" class="detail">Private socket</text>
  <path class="edge" d="M210 188 H232 V277 H255"/>
  <path class="edge" d="M210 368 H232 V277 H255"/>
  <path class="edge" d="M425 277 H470"/>
  <rect class="node" x="495" y="100" width="280" height="70" rx="8"/>
  <text x="635.0" y="129" text-anchor="middle">SQLite control state</text>
  <text x="635.0" y="153" text-anchor="middle" class="detail">Conversation / intents / receipts</text>
  <rect class="node" x="495" y="200" width="280" height="70" rx="8"/>
  <text x="635.0" y="229" text-anchor="middle">Immutable artifacts</text>
  <text x="635.0" y="253" text-anchor="middle" class="detail">Source / context / candidates</text>
  <rect class="node" x="495" y="300" width="280" height="70" rx="8"/>
  <text x="635.0" y="329" text-anchor="middle">Authority gates</text>
  <text x="635.0" y="353" text-anchor="middle" class="detail">Grants / budgets / evidence</text>
  <rect class="node" x="495" y="400" width="280" height="70" rx="8"/>
  <text x="635.0" y="429" text-anchor="middle">Execution ownership</text>
  <text x="635.0" y="453" text-anchor="middle" class="detail">Intent / submission / closure</text>
  <rect class="node" x="875" y="100" width="295" height="75" rx="8"/>
  <text x="1022.5" y="129" text-anchor="middle">OpenAI / Anthropic clients</text>
  <text x="1022.5" y="153" text-anchor="middle" class="detail">Bounded native profiles</text>
  <rect class="node" x="875" y="275" width="295" height="75" rx="8"/>
  <text x="1022.5" y="304" text-anchor="middle">Local runtime</text>
  <text x="1022.5" y="328" text-anchor="middle" class="detail">Explicit selected loaded model</text>
  <rect class="node" x="875" y="450" width="295" height="75" rx="8"/>
  <text x="1022.5" y="479" text-anchor="middle">Google setup and quota</text>
  <text x="1022.5" y="503" text-anchor="middle" class="detail">ACP writer unavailable</text>
  <path class="edge" d="M775 435 H835 V138 H875"/>
  <path class="edge" d="M835 313 H875"/>
  <path class="edge" d="M835 435 V488 H875"/>
  <text x="600" y="580" text-anchor="middle" class="detail">Profile availability, process closure and live evidence are separate facts.</text>
</svg>
