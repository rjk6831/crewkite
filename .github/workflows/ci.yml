name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Branch name
        if: github.event_name == 'pull_request'
        run: node scripts/policy.mjs branch "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          PROVENANCE_PATTERN: ${{ vars.PROVENANCE_PATTERN }}
      - name: Commit messages
        run: |
          if [ "$EVENT" = pull_request ]; then range="$BASE..$HEAD"
          elif [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then range="$BEFORE..$AFTER"
          else range=""; fi
          node scripts/policy.mjs commits $range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PROVENANCE_PATTERN: ${{ vars.PROVENANCE_PATTERN }}
      - name: Tree, prose and provenance
        run: node scripts/policy.mjs all
        env:
          PROVENANCE_PATTERN: ${{ vars.PROVENANCE_PATTERN }}
      - name: Policy self-tests
        run: node --test scripts/policy.test.mjs

  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned package manager
        run: |
          npm install --prefix .ci-tools --no-package-lock pnpm@12.11.2
          echo "$PWD/.ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install pinned desktop runtime
        run: pnpm desktop:install
      # The test runner prints each file's start and end, so the log shows which file hung or
      # failed on a runner I cannot reach. tee keeps the live log and pipefail keeps the exit code.
      - name: Verify workspace and desktop journey
        timeout-minutes: 12
        shell: bash
        run: pnpm verify 2>&1 | tee "$RUNNER_TEMP/verify-output.log"
        env:
          PROVENANCE_PATTERN: ${{ vars.PROVENANCE_PATTERN }}
      - name: Keep the verify output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-output-macos
          path: ${{ runner.temp }}/verify-output.log
          if-no-files-found: warn
          retention-days: 14

  # Single required check. It fails unless every predecessor succeeded,
  # so a skipped or cancelled job never counts as coverage.
  required:
    if: always()
    needs: [policy, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every predecessor succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
